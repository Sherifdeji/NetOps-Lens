version 15.2
hostname r1
!
interface GigabitEthernet0/0
 description Link to r2
 ip address 10.0.12.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Application LAN
 ip address 192.0.2.1 255.255.255.0
 ip access-group DB-FILTER in
 no shutdown
!
ip access-list extended DB-FILTER
 10 permit tcp 192.0.2.0 0.0.0.255 198.51.100.0 0.0.0.255 eq 1433
 20 deny tcp 192.0.2.0 0.0.0.255 198.51.100.0 0.0.0.255 eq 22
!
ip route 198.51.100.0 255.255.255.0 10.0.12.2
!
end
