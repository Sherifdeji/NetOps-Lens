[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-lens"
version = "0.1.0"
description = "AI-powered network configuration change investigation (V1: read-only assessment + candidate verification)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pybatfish",
    "pandas",
    "streamlit",
    "pydantic>=2,<3",
    "pyyaml",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "mypy",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# F-07: ordinary runs execute only safe deterministic tests. Live
# Meta API + Batfish integration runs explicitly with: pytest -m live.
# Controlled Batfish snapshot-lifecycle runs explicitly with:
# NETOPS_LENS_RUN_BATFISH_INTEGRATION=1 pytest -m integration tests/integration
addopts = ["-m", "not live and not integration"]
markers = [
    "live: live Meta API + Batfish integration (excluded from default runs)",
    "integration: controlled live-Batfish lifecycle (opt-in via env, excluded from default runs)",
]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F"]
